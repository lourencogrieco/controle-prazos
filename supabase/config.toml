
[auth]
site_url = "https://financeiro-ng.onrender.com"
additional_redirect_urls = ["https://legal-hub-seven.vercel.app"]

[auth.email]
# O cadastro do Legal Hub cria a sessão, a empresa e o vínculo em uma única etapa.
# A verificação por e-mail pode ser reativada quando houver SMTP próprio.
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.sync-intimacoes]
enabled = true
verify_jwt = true
import_map = "./functions/sync-intimacoes/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/sync-intimacoes/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/sync-intimacoes/*.html" ]

[functions.notificar-prazos]
enabled = true
verify_jwt = true
entrypoint = "./functions/notificar-prazos/index.ts"
